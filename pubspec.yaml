name: capcut_clone
description: Aplikasi editor video Android dengan fitur mirip CapCut.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.6.7
  video_player: ^2.9.0
  provider: ^6.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
